<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Splash Screen</title>
  <link rel="stylesheet" href="Testing.css">
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <img src="Todologo-removebg-preview.png" alt="Company Logo" id="logo">

  <div class="progress-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
</div>

<!-- Main Content -->
<div id="main-content" class="screen">

  <!-- Skip -->
  <button class="skip-btn">SKIP</button>

  <!-- Center Content -->
  <div class="content">

    <!-- Image -->
    <div class="slideshow-container">
      <img class="slide single" src="Slide1.jpg" alt="Slide 1">
    </div>

    <!-- Dash Indicator -->
    <div class="dash-indicator">
      <span class="dash active"></span>
      <span class="dash"></span>
      <span class="dash"></span>
    </div>

    <h2 class="title">Manage your tasks</h2>
    <p class="subtitle">
      You can easily manage all of your daily tasks in DoMe for free
    </p>
  </div>

  <!-- Bottom Navigation -->
  <div class="nav-buttons">
    <button class="back-btn">BACK</button>
    <button class="next-btn">NEXT</button>
  </div>

</div>

<script src="index.js"></script>
</body>
</html>
